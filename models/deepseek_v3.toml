# DeepSeek-V3 reference configuration. Constants from the model card and the playbook §1.2.

[model]
name = "deepseek-v3"
latent_dim = 512
rope_key_dim = 64
num_layers = 61
num_heads = 128
head_dim = 128

[block]
block_size_tokens = 64
ckv_dtype = "bf16"

[segment_index]
hnsw_m = 32
hnsw_ef_construction = 200
hnsw_ef_search = 64
similarity_threshold = 0.97
hnsw_latency_budget_us = 500

[kernel]
backend = "auto"
softmax_scale = 0.0441941738   # 1 / sqrt(512)

[runtime]
device = 0
gpu_memory_bytes = 42949672960   # 40 GiB

[observability]
prometheus_port = 9090
tracing_endpoint = ""
