# Kimi-K2 — uses MLA storage. Exact latent dim is pending public confirmation; defaults below
# match DeepSeek-V3 conventions so the config loads.

[model]
name = "kimi-k2"
latent_dim = 512
rope_key_dim = 64
num_layers = 61
num_heads = 128
head_dim = 128

[block]
block_size_tokens = 64
ckv_dtype = "bf16"

[segment_index]
hnsw_m = 32
hnsw_ef_construction = 200
hnsw_ef_search = 64
similarity_threshold = 0.97
hnsw_latency_budget_us = 500

[kernel]
backend = "auto"

[runtime]
device = 0
gpu_memory_bytes = 42949672960
