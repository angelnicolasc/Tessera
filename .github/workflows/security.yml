name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"   # Mondays at 06:23 UTC
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # cargo-audit does not read deny.toml's `[advisories].ignore`, so advisories
      # ignored there have to be re-declared here. See deny.toml for the justifications.
      #   RUSTSEC-2024-0437 — protobuf 2.28 unparsed-input recursion (Tessera only emits
      #     Prometheus text format; never ingests external protobuf).
      #   RUSTSEC-2026-0176 — pyo3 0.24 PyList/PyTuple Iterator::nth OOB read. Fix is in
      #     0.29; numpy 0.28 still pins pyo3 ^0.28 so we can't bump in isolation.
      #     tessera-py never calls .nth/.nth_back on those iterators (verified by grep).
      #     Drop this ignore the moment numpy >= 0.29 ships.
      - run: cargo audit --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2026-0176

  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit --strict --requirement pyproject.toml || true
        # Soft-fail until we ship a locked requirements.txt; advisory still reported.
