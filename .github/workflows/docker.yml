name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "python/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push ghcr.io image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sprint 5.1 hardening (audit H5): SLSA-3 build provenance attestation requires
      # `id-token: write` (OIDC) and `attestations: write` for the GitHub-hosted
      # attestation store.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects repository names with uppercase letters; the upstream
      # `${{ github.repository }}` is `angelnicolasc/Tessera` (capital T) which
      # broke `docker pull` in the smoke-test step. Compute a lowercase
      # alternative once and reuse it everywhere downstream.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Sprint 5.1: dropped the stale `sprint2` tag that the workflow had been
          # publishing for three sprints. Tags now reflect actual semver / sha.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Sprint 5.1 hardening (audit H5): produce SLSA-3 build provenance and an SBOM
      # alongside the image so downstream consumers can verify integrity. `provenance:
      # mode=max` + `sbom: true` instruct buildx to attach both as image attestations.
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Sprint 5.1: GitHub-native build provenance attestation, separate from the buildx
      # attestation above. Two attestations beat one: buildx's lives next to the image in
      # the registry, GitHub's lives in the project's transparency log.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Smoke-test the pushed image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -c "from tessera import _native; print('tessera', _native.__version__, '— smoke test OK')"
