name: Build manylinux wheels

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "python/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  cibuildwheel:
    name: manylinux_2_28 — Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["cp311", "cp312"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build wheel via cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: pip install maturin
          CIBW_BUILD_VERBOSITY: 1
          # Run inside the manylinux container; Rust toolchain comes from dtolnay action above.
          CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH"'

      - name: Smoke-test the produced wheel
        run: |
          pip install wheelhouse/*.whl
          python -c "from tessera import _native; print('tessera', _native.__version__, '— OK')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: manylinux-wheels-${{ matrix.python }}
          path: wheelhouse/*.whl
          retention-days: 30
