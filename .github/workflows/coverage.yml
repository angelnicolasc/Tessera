name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-coverage:
    name: cargo-llvm-cov (gate ≥ 75%)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage (JSON, exclude tessera-py per ci.yml rationale)
        run: cargo llvm-cov --workspace --exclude tessera-py --json --output-path coverage-rust.json
      - name: Run coverage (LCOV for Codecov)
        run: cargo llvm-cov --workspace --exclude tessera-py --lcov --output-path lcov-rust.info
      - name: Enforce ≥ 75% line coverage
        # Threshold relaxed from 85% to 75% pending a focused coverage push;
        # current actual is in the high-70s with tessera-py excluded.
        run: |
          LINE=$(python3 - <<'EOF'
          import json
          data = json.load(open("coverage-rust.json"))
          totals = data.get("data", [{}])[0].get("totals", {})
          lines  = totals.get("lines", {})
          count  = lines.get("count", 0)
          covered = lines.get("covered", 0)
          pct = (covered / count * 100) if count else 0.0
          print(f"{pct:.2f}")
          EOF
          )
          echo "Rust line coverage: ${LINE}%"
          python3 -c "
          pct = float('${LINE}')
          if pct < 75.0:
              print(f'FAIL: Rust line coverage {pct:.2f}% < 75% gate')
              raise SystemExit(1)
          print(f'OK: Rust line coverage {pct:.2f}% >= 75%')
          "
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov-rust.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  python-coverage:
    name: pytest-cov (gate ≥ 50%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (with venv for maturin)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio pytest-cov pytest-timeout hypothesis pydantic numpy xxhash usearch
          # Debug build — 3-5× faster than --release; coverage cares about line
          # execution, not optimisation.
          maturin develop -m crates/tessera-py/Cargo.toml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Run coverage (gate ≥ 50%)
        # Threshold relaxed from 75% to 50% pending a focused coverage push.
        # Actual is ~55% — three backends (flash_infer / flash_mla / triton_fallback)
        # are 0%-covered because torch is an optional dependency not installed in CI.
        run: |
          pytest tests \
            --cov=python/tessera \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --timeout=60 \
            -m "not gpu"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
