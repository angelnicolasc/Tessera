name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-coverage:
    name: cargo-llvm-cov (gate ≥ 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage (JSON)
        run: cargo llvm-cov --workspace --json --output-path coverage-rust.json
      - name: Run coverage (LCOV for Codecov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov-rust.info
      - name: Enforce ≥ 85% line coverage
        run: |
          LINE=$(python3 - <<'EOF'
          import json, sys
          data = json.load(open("coverage-rust.json"))
          totals = data.get("data", [{}])[0].get("totals", {})
          lines  = totals.get("lines", {})
          count  = lines.get("count", 0)
          covered = lines.get("covered", 0)
          pct = (covered / count * 100) if count else 0.0
          print(f"{pct:.2f}")
          EOF
          )
          echo "Rust line coverage: ${LINE}%"
          python3 -c "
          pct = float('${LINE}')
          if pct < 85.0:
              print(f'FAIL: Rust line coverage {pct:.2f}% < 85% gate')
              raise SystemExit(1)
          print(f'OK: Rust line coverage {pct:.2f}% >= 85%')
          "
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov-rust.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  python-coverage:
    name: pytest-cov (gate ≥ 75%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio pytest-cov pydantic numpy xxhash usearch
          maturin develop -m crates/tessera-py/Cargo.toml --release
      - name: Run coverage (hard gate ≥ 75%)
        run: |
          pytest tests \
            --cov=python/tessera \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -m "not gpu"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
