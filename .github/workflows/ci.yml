name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust:
    name: Test Rust (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.85.0"]
        include:
          - os: ubuntu-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest run
        # Per-test timeouts come from .config/nextest.toml (slow-timeout +
        # terminate-after). tessera-py exclusion: same reason as before
        # (extension-module cdylib can't be linked as a normal test binary on
        # macOS/Windows).
        run: cargo nextest run --workspace --exclude tessera-py --no-fail-fast
        env:
          RUST_BACKTRACE: "1"
      - name: cargo bench --no-run
        run: cargo bench --workspace --exclude tessera-py --no-run

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          # Install runtime deps so pyright can resolve `import xxhash`, `import usearch`
          # etc. without going to "unknown" for every typed expression downstream.
          pip install ruff pyright pydantic numpy xxhash usearch
      - name: ruff check
        run: ruff check python tests benchmarks
      - name: ruff format
        run: ruff format --check python tests benchmarks
      - name: pyright
        # Pyright runs strict on first-party source only. `tests/` is intentionally
        # untyped (math notation, lazy imports, mock-heavy fixtures) and would generate
        # hundreds of false positives under strict mode without adding test value.
        run: pyright python

  test-python:
    name: Test Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Create venv and install maturin + dev deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          # `pytest-timeout` enforces a per-test ceiling; without it a single hanging
          # test can burn the full job timeout (we lost ~5 h to this previously).
          pip install maturin pytest pytest-asyncio pytest-timeout hypothesis pydantic numpy xxhash usearch
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: maturin develop
        # Drop --release: debug builds are 3-5× faster and the only differences that
        # matter for correctness tests are panic codegen and optimisation. The release
        # path is still covered by Build wheel.
        run: maturin develop -m crates/tessera-py/Cargo.toml
      - name: pytest
        run: pytest tests -v -m "not gpu" --timeout=60 --timeout-method=thread

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install maturin
      - name: Build sdist + wheel
        run: maturin build --release --sdist -m crates/tessera-py/Cargo.toml
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: target/wheels/*

  build-cuda:
    name: Build CUDA (compile-only)
    # Pinned to 22.04: NVIDIA stopped shipping `cuda-nvcc-12-4` packages for Ubuntu 24.04
    # ("noble"); ubuntu-latest moved to 24.04 and the install step now fails. 22.04 still
    # has the 12.4 archive that matches the workspace cudarc `cuda-12040` feature pin.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda
      - name: Install gcc-12 (usearch's numkong build emits AVX-512-FP16 target
          attributes that ubuntu-22.04's default gcc-11 does not recognise)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"
      - name: Install CUDA toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.18
        with:
          cuda: "12.4.0"
          method: network
          sub-packages: '["nvcc", "toolkit"]'
      - name: cargo build --features cuda
        run: cargo build --workspace --features cuda
        env:
          # cudarc links against libcuda.so at runtime; stub satisfies the linker at build time.
          RUSTFLAGS: "-Dwarnings"

  build-nccl:
    name: Build NCCL feature (compile-only, Sprint 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: nccl
      - name: cargo build --features nccl
        # The nccl feature in Sprint 3 is compile-only (NcclTransport stubs return
        # structured errors at runtime). No NCCL runtime install required for this gate.
        run: cargo build --workspace --features nccl
        env:
          RUSTFLAGS: "-Dwarnings"

  test-multirank-python:
    name: Multi-rank Python E2E (Sprint 3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: multirank-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (with venv for maturin)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio pytest-timeout hypothesis pydantic numpy xxhash usearch
          # Debug build: 3-5× faster than --release and good enough for E2E
          # correctness assertions. Release build is exercised by Build wheel.
          maturin develop -m crates/tessera-py/Cargo.toml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: pytest tests/multirank
        run: pytest tests/multirank -v -m "not gpu" --timeout=120 --timeout-method=thread
      - name: pytest tests/test_hypothesis_*
        run: pytest tests/test_hypothesis_allocator.py tests/test_hypothesis_distributed.py -v --timeout=60 --timeout-method=thread --timeout-method=thread

  build-otel-rust:
    name: Build OTel-Rust feature (compile-only, Sprint 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: otel-rust
      - name: cargo build --features otel-rust
        # The otel-rust feature pulls in the opentelemetry ecosystem (tonic, ring, prost);
        # the dep version set is pinned in the workspace Cargo.toml. This job validates the
        # pin survives every push — the OTel ecosystem is known for breaking minor bumps.
        run: cargo build --workspace --features otel-rust
        env:
          RUSTFLAGS: "-Dwarnings"

  ci-gate:
    name: CI gate
    needs:
      - lint-rust
      - test-rust
      - lint-python
      - test-python
      - build-wheel
      - build-cuda
      - build-nccl
      - build-otel-rust
      - test-multirank-python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "All required jobs passed."
