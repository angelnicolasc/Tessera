[book]
title = "Tessera"
description = "MLA-aware KV block manager for multi-agent inference"
authors = ["Tessera Contributors"]
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/angelnicolasc/tessera"
edit-url-template = "https://github.com/angelnicolasc/tessera/edit/main/docs/{path}"
mathjax-support = true
copy-fonts = true
no-section-label = false
additional-css = []

[output.html.fold]
enable = true
level = 1
