[workspace]
resolver = "2"
members = [
    "crates/tessera-core",
    "crates/tessera-index",
    "crates/tessera-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Tessera Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/angelnicolasc/tessera"
homepage = "https://angelnicolasc.github.io/tessera"
documentation = "https://angelnicolasc.github.io/tessera"
readme = "README.md"
keywords = ["mla", "kv-cache", "inference", "vllm", "deepseek"]
categories = ["memory-management", "science", "concurrency"]

[workspace.dependencies]
# Internal crates
tessera-core = { path = "crates/tessera-core", version = "0.1.0" }
tessera-index = { path = "crates/tessera-index", version = "0.1.0" }

# Core
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

# Concurrency primitives
dashmap = "5.5"
parking_lot = "0.12"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Serialization
# `rc` enables Serialize/Deserialize for `Arc<T>` / `Rc<T>`, needed by
# `MlaBlockConfig::schemes_per_layer` which uses `Arc<Vec<CompressionScheme>>`.
serde = { version = "1.0", features = ["derive", "rc"] }
toml = "0.8"

# Metrics
# Pinned to 0.13: 0.14 tightened with_label_values signature in ways that ripple
# through every metric call site in the workspace (RUSTSEC-2024-0437 is the protobuf 2.28
# recursion CVE in prometheus's pull-encoder; we don't ingest external protobuf, so
# the advisory is documented & ignored in deny.toml).
prometheus = "0.13"
lazy_static = "1.5"

# ANN
usearch = "2.12"

# Python bindings
# 0.24+ closes RUSTSEC-2025-0020 (PyString::from_object overflow). Source already uses the
# Bound<'py, T> API so the bump is mechanical.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"] }
numpy = "0.24"

# Test / bench
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
rand = "0.8"
rand_chacha = "0.3"

# Optional CUDA
# cudarc 0.12 ships `driver` only; the `runtime` feature was added in 0.13 (renamed
# from the old combined `cuda` feature). Tessera's CUDA backend in
# `crates/tessera-core/src/device/cuda.rs` only touches the driver API
# (`cudarc::driver::{CudaDevice, CudaSlice, ...}`), so the runtime feature is not needed.
cudarc = { version = "0.12", default-features = false, features = ["cuda-12040", "driver"] }

# Async runtime + async traits (Sprint 3: RankTransport, DistributedSegmentIndex)
tokio = { version = "1.40", features = ["sync", "macros", "rt-multi-thread", "time"] }
async-trait = "0.1"
futures = "0.3"

# Sprint 4: optional OTLP tracing bridge for the Rust core. The observability.rs
# bridge was written for the 0.27 API set (SpanExporter::builder().with_tonic(),
# trace::Builder::with_resource, etc.). 0.26 lacks both — pin to the matched 0.27
# ecosystem.
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
# tracing-subscriber is used by observability::init_otlp_tracing under the otel-rust
# feature; it must be a regular (optional) dep, not just dev.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# `pedantic` / `nursery` were tried at `warn` but produce ~200 advisory hits across the
# workspace (cast precision, map_or simplifications, doc backticks, …) that don't reflect
# real bugs. Combined with the `-Dwarnings` RUSTFLAGS in CI they made every push red.
# Demoted to `allow`; enable opt-in per-crate when a focused cleanup lands.
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Style relaxations that conflict with engineering pragmatism:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "symbols"
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 0
debug = true
