[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tessera"
version = "0.1.0"
description = "MLA-aware KV block manager for multi-agent inference (vLLM V1 plugin)"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Tessera Contributors" }]
keywords = ["mla", "kv-cache", "inference", "vllm", "deepseek", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "xxhash>=3.4",
    "usearch>=2.12",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
vllm = ["vllm>=0.22.0"]
flashinfer = ["flashinfer>=0.2"]
flash-mla = ["flash-mla"]
observability = [
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",   # Sprint 4: boundary fuzz at the Python ↔ Rust seam
    "ruff>=0.7",
    "pyright>=1.1.388",
    "maturin>=1.7",
    "pip-audit>=2.7",
]
docs = ["mdbook>=0.4"]
all = ["tessera[torch,vllm,flashinfer,observability,dev]"]

[project.urls]
Homepage = "https://angelnicolasc.github.io/tessera"
Repository = "https://github.com/angelnicolasc/tessera"
Documentation = "https://angelnicolasc.github.io/tessera"
Issues = "https://github.com/angelnicolasc/tessera/issues"
Changelog = "https://github.com/angelnicolasc/tessera/blob/main/CHANGELOG.md"

# Registers Tessera's BlockAllocator with vLLM's V1 plugin system.
# vLLM discovers it via importlib.metadata.entry_points(group="vllm.block_allocator").
[project.entry-points."vllm.block_allocator"]
tessera = "tessera.vllm_plugin:TesseraBlockAllocator"

[tool.maturin]
module-name = "tessera._native"
python-source = "python"
manifest-path = "crates/tessera-py/Cargo.toml"
features = ["pyo3/extension-module"]
strip = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests", "benchmarks"]
extend-exclude = ["docs/book", "target"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "RUF",  # ruff-specific
    "PT",   # flake8-pytest-style
    "PERF", # perflint
    "D",    # pydocstyle
]
ignore = [
    "D100", "D104",          # public module / package docstrings
    "D102", "D105", "D107",  # method / magic / __init__ docstrings (internal code)
    "D203", "D213",          # docstring style conflicts
    "D205",                  # blank line after summary (too strict for short docs)
    "D417",                  # undocumented params (signatures are self-describing)
    "PLR0913",               # too many arguments
    "S101",                  # assert in tests
    "ANN401",                # Any at FFI boundaries (PyO3 native module is opaque)
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode (μ, σ, etc. in scientific notation)
    "UP042",                 # StrEnum migration — opt-in, not blocking
    "E501",                  # line length (formatter handles this)
    "PLC0415",               # lazy / optional imports are a project pattern
    "PLR2004",               # magic-value comparison (case-by-case via noqa)
]

[tool.ruff.lint.per-file-ignores]
# Tests use math notation (B, H, S, W_UV), lazy imports for optional deps,
# and other patterns that are intentional. Suppress style-only checks here.
"tests/**" = [
    "D", "ANN", "S", "PLR2004",
    "N",        # math notation in test variable names
    "PLC0415",  # lazy imports after pytest.importorskip
    "E402",     # module imports after sys.path mutation
    "F841",     # unused vars in shape assertions
    "C408",     # dict() vs {} — tests favor readability
    "B007",     # unused loop var in test scaffolding
    "SIM102",   # nested ifs in test setup
    "PT006", "PT011",  # pytest style nits
    "RET504",          # explicit returns in tests
    "PERF403",         # comprehension micro-opt
    "RUF006",          # asyncio task tracking in fixtures
    "RUF043",          # pytest.raises pattern style
]
"benchmarks/**" = [
    "D", "ANN", "S", "PLR2004", "T201",
    "N", "PLC0415", "E402", "F841",
]
# Reference attention mirrors the DeepSeek-V3 MLA paper notation (B, H, S, W_UV, qR, KR);
# enforcing snake_case here would obscure the formula-to-code mapping.
"python/tessera/reference/**" = ["N"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
# `basic` mode is the right ceiling for this codebase: heavy reliance on untyped
# externals (torch, vllm, flashinfer, the maturin-built native module) makes `strict`
# generate noise without surfacing real bugs. Modules can opt into stricter checking
# via per-file pragma comments when their annotations are complete.
include = ["python"]
exclude = ["**/__pycache__", "**/.pytest_cache", "target", "docs/book", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = "warning"
reportPrivateUsage = "warning"
reportUnknownMemberType = "none"     # PyO3 native module is opaque without stubs
reportUnknownVariableType = "none"
reportMissingImports = "warning"     # optional deps (torch/vllm/flashinfer)
# `__all__` re-exports symbols from the maturin-built `_native` extension module,
# which pyright cannot import at lint time. The .pyi stub covers the runtime surface.
reportUnsupportedDunderAll = "none"
# `torch.einsum` / `torch.softmax` are flagged as private re-exports by pyright; they are
# part of torch's documented public API in practice. The reference implementation uses them.
reportPrivateImportUsage = "none"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "gpu: requires a CUDA-capable GPU (skipped on CPU-only runners)",
    "slow: long-running tests",
    "integration: cross-component tests",
]

[tool.coverage.run]
branch = true
source = ["python/tessera"]
omit = ["python/tessera/_native.pyi"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
