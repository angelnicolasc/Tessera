# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "warn"
ignore = [
    # protobuf 2.28 — uncontrolled recursion in the pull-encoder when parsing untrusted
    # input. Reached via prometheus 0.13 -> protobuf 2.28. Tessera only emits Prometheus
    # exposition format (text), never ingests external protobuf, so the recursion CVE is
    # not reachable. Tracked for re-evaluation when bumping prometheus to 0.14 (the bump
    # tightens with_label_values<V> signature in a way that touches every metric call site
    # and is out of scope for this CI-unblock PR — follow-up).
    { id = "RUSTSEC-2024-0437", reason = "prometheus exposition path does not parse external protobuf" },
    # pyo3 0.24 - out-of-bounds read in BoundListIterator::nth / nth_back and
    # BoundTupleIterator::nth / nth_back when caller supplies a large user-controlled `n`.
    # Fix is in pyo3 0.29.0 (released 2026-06-11) but the `numpy` crate is at 0.28.0
    # (2026-02-08) and still pins pyo3 ^0.28 — bumping pyo3 alone fails to link due to
    # the `links = "python"` rule. Reachability: tessera-py never calls .nth() or
    # .nth_back() on a PyList or PyTuple iterator (verified by grep over
    # crates/tessera-py/src/lib.rs); all Python list arguments are converted via
    # `Vec<T>: FromPyObject` which uses `iter().collect()`, never user-controlled indexing.
    # Tracked as TD-043 in DEVLOG; the bump is mechanical once numpy >= 0.29 lands.
    { id = "RUSTSEC-2026-0176", reason = "tessera-py does not call Iterator::nth/nth_back on PyList/PyTuple iterators (verified by grep); waiting for numpy 0.29 to upgrade pyo3 to 0.29" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Boost Software License — OSI-approved, FSF Free/Libre, permissive.
    # Pulled in transitively by `xxhash-rust`.
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
