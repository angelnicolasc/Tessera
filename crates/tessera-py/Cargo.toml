[package]
name = "tessera-py"
description = "PyO3 bindings exposing the Tessera Rust core to Python (module: tessera._native)."
# Inlined for release-please; see comment in crates/tessera-core/Cargo.toml.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Forwards the optional CUDA backend through PyO3. Requires `tessera-core/cuda`.
cuda = ["tessera-core/cuda"]

[dependencies]
tessera-core.workspace = true
tessera-index.workspace = true
pyo3.workspace = true
numpy.workspace = true
anyhow.workspace = true
tracing.workspace = true
# Used by the process-wide TOKIO_RT in lib.rs to drive async Rust APIs from the
# synchronous Python boundary (see docs/src/adr/0014-multi-rank-architecture.md).
tokio.workspace = true
