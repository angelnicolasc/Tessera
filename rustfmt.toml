edition = "2021"
max_width = 100
tab_spaces = 4
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
# Note: imports_granularity, group_imports, format_code_in_doc_comments,
# normalize_comments, wrap_comments are nightly-only rustfmt options.
# We keep rustfmt.toml stable; opt into them in CI via nightly rustfmt if desired.
